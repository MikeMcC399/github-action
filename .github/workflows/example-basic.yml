name: example-basic
# This workflow represents a set of basic End-to-End tests
#
# In the example jobs, the action is called with
# uses: ./
# which runs the action code from the current branch.
# If you copy this workflow to another repo, replace the line with
# uses: cypress-io/github-action@v7
on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  basic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            browser: chrome
          - os: ubuntu-22.04-arm
            browser: firefox
          - os: ubuntu-24.04
            browser: chrome
          - os: ubuntu-24.04
            browser: electron
          - os: ubuntu-24.04-arm
            browser: firefox
          - os: ubuntu-26.04
            browser: chrome
          - os: windows-2025
            browser: chrome
          - os: windows-11-arm
            browser: chrome
          - os: macos-26
            browser: chrome
          - os: macos-26-intel
            browser: chrome
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cypress tests
        uses: ./
        # the parameters below are only necessary
        # because we are running these examples in a monorepo
        with:
          working-directory: examples/basic
          browser: ${{ matrix.browser }}
          # just for full picture after installing Cypress
          # print information about detected browsers, etc
          # see https://on.cypress.io/command-line#cypress-info
          build: npx cypress info

  basic-npm-cache:
    # Use setup-node to cache npm dependencies
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            browser: chrome
          - os: ubuntu-22.04-arm
            browser: firefox
          - os: ubuntu-24.04
            browser: chrome
          - os: ubuntu-24.04
            browser: electron
          - os: ubuntu-24.04-arm
            browser: firefox
          - os: ubuntu-26.04
            browser: chrome
          - os: windows-2025
            browser: chrome
          - os: windows-11-arm
            browser: chrome
          - os: macos-26
            browser: chrome
          - os: macos-26-intel
            browser: chrome
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: examples/basic/package-lock.json

      - name: Cypress tests
        uses: ./
        with:
          package-manager-cache: false
          working-directory: examples/basic
          browser: ${{ matrix.browser }}
          build: npx cypress info
