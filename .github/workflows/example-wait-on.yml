name: example-wait-on
# In the example jobs, the action is called with
# uses: ./
# which runs the action code from the current branch.
# If you copy this workflow to another repo, replace the line with
# uses: cypress-io/github-action@v7
on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:

  wait-on-vite:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cypress tests
        uses: ./
        with:
          working-directory: examples/wait-on-vite
          start: npx vite --host
          wait-on: 'http://localhost:5173'

  wait-on-vite-https:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cypress tests
        uses: ./
        env:
          # trust the committed self-signed certificate used by vite.config-https.js
          # (NODE_TLS_REJECT_UNAUTHORIZED is not honored by got, see sindresorhus/got#1961)
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/examples/wait-on-vite/certs/localhost-cert.pem
        with:
          working-directory: examples/wait-on-vite
          config-file: cypress.config-https.js
          start: npm run dev:https -- --host
          wait-on: 'https://localhost:5174'
